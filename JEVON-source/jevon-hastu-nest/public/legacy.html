<!doctype html><html lang="tg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEVON | Ҳасту нест</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#0e3a5a;color:#183b55;font:18px Arial,sans-serif}.card{max-width:660px;margin:5vh auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px #09263b}header{text-align:center;padding:24px 12px 16px;border-bottom:1px solid #e6edf1}h1{font-size:34px;margin:0;color:#0e3a5a}header p{margin:8px 0 0;color:#647888}main{padding:25px}button,input{font:inherit}button{display:block;width:100%;padding:18px;margin:10px 0;border:0;border-radius:14px;background:#123d5b;color:white;font-weight:bold;min-height:62px}button:disabled{opacity:.6}.green{background:#00966e}.red{background:#ed3544}.light{background:#e9f3f8;color:#123d5b}input{display:block;width:100%;padding:17px;text-align:center;border:2px solid #b9ccd8;border-radius:14px;font-size:27px;letter-spacing:.35em}label{display:block;text-align:center;font-weight:bold;margin-bottom:15px}.view{position:relative;background:#081721;border-radius:16px;overflow:hidden;margin-bottom:15px;min-height:220px}video,img{display:block;width:100%;max-height:65vh;object-fit:cover;transform:scaleX(-1)}img{transform:none}.count{position:absolute;top:35%;left:0;width:100%;text-align:center;color:#fff;font-size:100px;font-weight:bold}.message{color:#b91c1c;text-align:center;font-weight:bold;margin:15px 0}.success{text-align:center;color:#008b67;font-size:32px;font-weight:bold}.hidden{display:none}small{display:block;text-align:center;color:#647888;margin:12px}
</style></head><body><div class="card"><header><h1>JEVON | Ҳасту нест</h1><p id="subtitle">Амалро интихоб кунед</p></header><main>
<div id="actions"><button class="green" onclick="choose('IN')">Ба кор омадам</button><button class="red" onclick="choose('OUT')">Аз кор рафтам</button></div>
<div id="codePage" class="hidden"><label for="code">Коди шахсии худро ворид кунед</label><input id="code" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"><button onclick="openCamera()">Кушодани камера</button><button class="light" onclick="reset()">← Бозгашт</button></div>
<div id="cameraPage" class="hidden"><div class="view"><video id="video" autoplay muted playsinline></video><img id="photo" class="hidden" alt="Сурати корманд"><div id="count" class="count"></div></div><div id="fallback" class="hidden"><small>Камераи браузер дастрас нест. Бо тугмаи поён сурат гиред.</small><input id="nativePhoto" type="file" accept="image/*" capture="user"></div><button id="retry" class="light hidden" onclick="openCamera()">Аз нав гирифтан</button><button id="send" class="green hidden" onclick="submitPhoto()">Ба қайд даровардан</button><button class="light" onclick="reset()">← Бозгашт</button></div>
<div id="successPage" class="hidden"><p id="successText" class="success"></p><button class="light" onclick="reset()">Ба саҳифаи аввал</button></div><p id="error" class="message" role="alert"></p><canvas id="canvas" class="hidden"></canvas>
</main></div><script>
var action=null,stream=null,photoData='',timer=null,busy=false;function el(id){return document.getElementById(id)}function show(id){var ids=['actions','codePage','cameraPage','successPage'];for(var i=0;i<ids.length;i++)el(ids[i]).className=ids[i]===id?'':'hidden'}function error(s){el('error').textContent=s||''}function stop(){if(timer)clearTimeout(timer);timer=null;if(stream){var tracks=stream.getTracks();for(var i=0;i<tracks.length;i++)tracks[i].stop();stream=null}}function reset(){stop();action=null;photoData='';busy=false;el('code').value='';el('nativePhoto').value='';el('photo').className='hidden';el('video').className='';el('fallback').className='hidden';el('retry').className='hidden';el('send').className='hidden';el('count').textContent='';el('subtitle').textContent='Амалро интихоб кунед';error('');show('actions')}
function choose(a){action=a;el('subtitle').textContent=a==='IN'?'Омадан ба кор':'Рафтан аз кор';error('');show('codePage');el('code').focus()}el('code').oninput=function(){this.value=this.value.replace(/\D/g,'').slice(0,4);if(this.value.length===4)openCamera()};
function openCamera(){var code=el('code').value;if(code.length!==4){error('Коди 4-рақамаро пурра ворид кунед.');return}stop();photoData='';error('');el('count').textContent='';el('photo').className='hidden';el('video').className='';el('fallback').className='hidden';el('retry').className='hidden';el('send').className='hidden';el('subtitle').textContent='Ба камера нигоҳ кунед';show('cameraPage');var media=navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;if(!media){nativeFallback();return}navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(function(s){stream=s;var v=el('video');try{v.srcObject=s}catch(e){v.src=URL.createObjectURL(s)}var played=v.play();if(played&&played.catch)played.catch(function(){nativeFallback()});var n=3;function tick(){if(!stream)return;if(n){el('count').textContent=n--;timer=setTimeout(tick,1000)}else capture()}timer=setTimeout(tick,800)}).catch(function(){nativeFallback()})}
function nativeFallback(){stop();el('video').className='hidden';el('count').textContent='';el('fallback').className='';error('Барои суратгирӣ камераи дастгоҳро кушоед.')}function capture(){var v=el('video'),c=el('canvas');if(!v.videoWidth){nativeFallback();return}c.width=Math.min(v.videoWidth,900);c.height=Math.round(c.width*v.videoHeight/v.videoWidth);var x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.75);stop();preview()}function preview(){el('count').textContent='';el('video').className='hidden';el('fallback').className='hidden';el('photo').src=photoData;el('photo').className='';el('retry').className='light';el('send').className='green';el('subtitle').textContent='Суратро тасдиқ кунед';error('')}
el('nativePhoto').onchange=function(){var file=this.files&&this.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){var image=new Image();image.onload=function(){var c=el('canvas');c.width=Math.min(image.width,900);c.height=Math.round(c.width*image.height/image.width);c.getContext('2d').drawImage(image,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.75);preview()};image.src=reader.result};reader.readAsDataURL(file)};
function submitPhoto(){if(!photoData||busy)return;busy=true;el('send').disabled=true;error('');var xhr=new XMLHttpRequest();xhr.open('POST','/api/attendance');xhr.setRequestHeader('Content-Type','application/json');xhr.onload=function(){busy=false;el('send').disabled=false;var r;try{r=JSON.parse(xhr.responseText)}catch(e){error('Сервер ҷавоби нодуруст дод.');return}if(xhr.status<300&&r.ok){var msg=action==='IN'?'Хуш омадед!':'Роҳи сафед!';el('successText').textContent=r.message||msg;el('subtitle').textContent='Қайд бомуваффақият анҷом ёфт';show('successPage');if(window.speechSynthesis&&window.SpeechSynthesisUtterance){var utter=new SpeechSynthesisUtterance(msg);utter.lang='tg-TJ';speechSynthesis.speak(utter)}setTimeout(reset,3500)}else error(r.message||'Сабт нашуд.')};xhr.onerror=function(){busy=false;el('send').disabled=false;error('Алоқа бо сервер қатъ шуд. Аз нав кӯшиш кунед.')};xhr.send(JSON.stringify({code:el('code').value,action:action,photoData:photoData}))}
</script></body></html>
